name: Temporary B5 frontend qualification

on:
  push:
    branches:
      - feat/modern-b5-private-files-ui
    paths:
      - ".github/workflows/tmp-b5-frontend-qualify.yml"

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/modern-b5-private-files-ui
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json
      - name: Install locked dependencies
        working-directory: modern
        run: npm ci --ignore-scripts
      - name: Format and qualify B5 frontend
        shell: bash
        run: |
          set -euo pipefail
          cd modern
          npx --no-install prettier --write src ../docs/modernization-2026/b5-private-files-ui.md ../.github/workflows/modern-quality.yml
          npm audit --omit=dev --audit-level=high
          npm run check
          cd ..
          git rm .github/workflows/tmp-b5-frontend-qualify.yml
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add modern/src docs/modernization-2026/b5-private-files-ui.md .github/workflows/modern-quality.yml
          git commit -m "style(b5): canonicalize qualified private files frontend"
          git push origin HEAD:feat/modern-b5-private-files-ui
