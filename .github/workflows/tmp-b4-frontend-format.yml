name: Temporary B4 frontend formatter

on:
  push:
    branches:
      - feat/modern-b4-commerce-ui

permissions:
  contents: write

jobs:
  format-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/modern-b4-commerce-ui
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: modern/package-lock.json
      - working-directory: modern
        run: npm ci --ignore-scripts
      - name: Format and qualify B4 frontend
        shell: bash
        run: |
          set -euo pipefail
          cd modern
          npm exec -- prettier --write src
          npm audit --omit=dev --audit-level=high
          npm run check
          cd ..
          rm .github/workflows/tmp-b4-frontend-format.yml
          git add modern/src .github/workflows/tmp-b4-frontend-format.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(b4): format qualified commerce frontend"
          git push origin HEAD:feat/modern-b4-commerce-ui
